<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d57ff" />
  <meta name="description" content="Chill Party - a bilingual local multiplayer party game for YouTube Playables." />
  <title>Chill Party V0.3.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <main class="screen loading-screen" aria-label="Loading Chill Party">
      <section class="loading-card">
        <div class="loading-mark">CP</div>
        <strong>CHILL PARTY</strong>
        <span>Loading… / 載入中…</span>
      </section>
    </main>
  </div>
  <!-- REQUIRED: YouTube Playables SDK must load before any game code. -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
